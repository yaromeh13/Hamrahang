<html xmlns="http://www.w3.org/1999/xhtml" >
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=1280, height=720, user-scalable=no, initial-scale=1.0, minimum-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#1c1b21"/>
    <meta name="cleartype" content="on">
    <meta property="og:title" content="Hamrahang">
    <meta name="application-name" content="Hamrahang Tv">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hamrahang Tv">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

	<title>Hamrahang TV</title>
	<link rel="icon" href="/favicon.png" type="image/png" sizes="16x16">

	<link rel="apple-touch-icon" href="/apple-icon.png" type="image/png" sizes="256x256">
	<script src="/js/spatial_navigation.js"></script>


	
<style>
/* =========================================================
   BASE CSS — 2013–2015 safe (no vars, no vh-only, no modern APIs)
   Modern polish lives in /tv.css (loaded only when flex/grid/… ok)
   ========================================================= */

/* ---------------------------------------------------------
   0. MINIMAL RESET (prerequisite for layout)
   box-sizing: IE8+, Chrome 10+, Safari 5.1+ — safe for 2013 TVs
   --------------------------------------------------------- */
*,
*::before,
*::after {
    -webkit-box-sizing: border-box;
    -moz-box-sizing: border-box;
    box-sizing: border-box;
}

/* ---------------------------------------------------------
   1. HTML / BODY — solid base (works without tv.css)
   height:100% chain for full-screen TV shells (avoid vh alone)
   --------------------------------------------------------- */
html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    cursor: default;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    font-weight: normal;
    line-height: 1.5;
    color: #ffffff;
    background-color: #1c1b21;
    min-width: 320px;
    text-align: left;
    overflow-x: hidden;
}

.ln {
    display: block;
    position: relative;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

.p-top-1 {
    padding-top: 1rem;
}
.p-top-2 {
    padding-top: 2rem;
}

/* ---------------------------------------------------------
   2. BACKGROUND LAYERS
   absolute fill + optional blur (-webkit for 2013 WebKit TVs)
   --------------------------------------------------------- */
#main-bg,
#stage-bg {
    display: block;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    background-position: center top;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0.35;
    -webkit-filter: blur(20px);
    filter: blur(20px);
    -webkit-transition: opacity 0.5s ease;
    -o-transition: opacity 0.5s ease;
    transition: opacity 0.5s ease;
    z-index: 0;
}

.ln > .main-container {
    position: relative;
    z-index: 1;
}

/* ---------------------------------------------------------
   3. LAYOUT - SIDEBAR & MAIN (float, 110px rail — no flex/grid)
   --------------------------------------------------------- */
.sidebar {
    float: left;
    width: 110px;
    min-width: 110px;
    height: 100%;
    background-color: #1c1b21;
    display: block;
}

.sidebar-content {
    position: fixed;
    display: block;
    top: 0;
    left: 0;
    bottom: 0;
    width: 110px;
    height: 100%;
    overflow: hidden;
}

.logo-container {
    display: block;
    width: 100%;
    padding: 12px 8px 8px;
    text-align: center;
    overflow: hidden;
}

.logo-container svg {
    display: block;
    width: 94px;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
}

.sidebar-content .menu {
    display: block;
    width: 100%;
    margin: 0;
    padding: 8px 0 0;
    list-style: none;
}

.sidebar-content .menu > div {
    display: block;
    width: 100%;
    text-align: center;
}

.sidebar-content .menu .item {
    display: block;
    width: 100%;
    padding: 14px 0;
    color: #b3b3b3;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
}

.sidebar-content .menu .item svg {
    display: inline-block;
    width: 28px;
    height: 28px;
    vertical-align: middle;
}

.sidebar-content .menu .item:hover,
.sidebar-content .menu .item:focus,
.sidebar-content .menu .item.active {
    color: #ffffff;
    background-color: #800000;
    outline: none;
}

.main-container {
    margin-left: 110px;
    height: 100%;
}

.main-content {
    position: relative;
    height: 100%;
}

.main-content .detailes-container {
    width: 60%;
    display: inline-block;
    vertical-align: top;
}

.main-content .playlist-container {
    height: 100%;
    width: 40%;
    position: relative;
    display: inline-block;
    vertical-align: top;
    overflow-x: hidden;
    overflow-y: hidden;
}

/* ---------------------------------------------------------
   4. PAGE DETAIL HEADER — 2013 base (no flex/grid/vars/clamp)
   --------------------------------------------------------- */
.page-detail-header-container {
    position: relative;
    display: block;
    width: 100%;
    height: 50%;
    margin: 0;
    padding: 10px;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.page-detail-header-container .thumbail {
    position: relative;
    float: left;
    width: 250px;
    height: 250px;
    background-color: #2a2a2a;
}

.page-detail-header-container .thumbail .placeholder {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    background-color: #333333;
    font-size: 140px;
    line-height: 250px;
    text-align: center;
    color: #555555;
}

.page-detail-header-container .thumbail img {
    display: block;
    width: 250px;
    height: 250px;
    border: 0;
    background-color: transparent !important;
    color: transparent !important;
}

.page-detail-header-container .content {
    display: block;
    margin-top: 10px;
    padding: 0 16px;
    overflow: hidden;
}

.page-detail-header-container .content .title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.page-detail-header-container .content .title h1 {
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    font-size: 2.5rem;
}

.page-detail-header-container .content .artists .list {
    display: block;
}

.page-detail-header-container .content .artists .list a,
.page-detail-header-container .content .artists .list span {
    display: inline;
}

.page-detail-header-container .content img {
    width: 60px;
    height: 60px;
    background-color: transparent !important;
    color: transparent !important;
    vertical-align: middle;
}

.page-detail-header-container .detailes {
    font-weight: 400;
    color: #c7c7c7;
}

.page-detail-header-container .content a {
    margin: 0 5px;
    padding: 0 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.page-detail-header-container .content a:hover,
.page-detail-header-container .content a:focus {
    border: none;
    outline: none;
    background-color: #800000;
    color: #fff;
}

.page-detail-actions {
    display: block;
}

.page-detail-actions .play {
    display: inline-block;
    width: 48px;
    height: 48px;
    line-height: 48px;
    text-align: center;
    font-size: 20px;
    background-color: #ffffff;
    color: #000000;
    cursor: pointer;
    vertical-align: middle;
}

.page-detail-actions .play:hover,
.page-detail-actions .play:focus {
    background-color: #ff0000;
    color: #ffffff;
    outline: none;
}

.detailes-container .detailes {
    padding: 0 10px;
}

.detailes-row {
    display: block;
}

.detailes-row .text1,
.detailes-row .text2 {
    display: inline-block;
    vertical-align: middle;
}

.detailes-container .page-detail-actions {
    display: block;
    width: 280px;
    padding: 24px 0 0 0;
}

.content-detail {
    display: block;
    width: 100%;
    overflow: hidden;
}

.content-detail > * {
    display: inline-block;
    vertical-align: top;
    width: 48%;
}

.about-container {
    display: block;
}

.about-container .title {
    font-size: 1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.about-container .text1 {
    font-weight: 400;
    color: #808080;
}

.about-container .text2 {
    font-weight: 500;
}

/* ---------------------------------------------------------
   5. TABS (MAIN + SETTING) — table / inline-block base
   --------------------------------------------------------- */
.main-tabs,
.setting-tabs {
    display: table;
    width: 100%;
    table-layout: fixed;
    margin: 0;
    padding: 0;
}

.main-tabs {
    text-align: center;
}

.main-tabs .item {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
    position: relative;
    padding: 7px;
    height: 100%;
    white-space: nowrap;
    color: #808080;
    cursor: pointer;
}

.main-tabs .item:hover,
.main-tabs .item:focus,
.setting-tabs .item:hover,
.setting-tabs .item:focus {
    background-color: #800000;
    color: #ffffff;
    outline: none;
}

.main-tabs .active,
.setting-tabs .active {
    color: #000000;
    background-color: #ffffff;
}

.setting-tabs {
    display: block;
    width: 100%;
    position: relative;
    overflow: hidden;
    padding: 0 16px;
    white-space: nowrap;
}

.setting-tabs .item {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    position: relative;
    white-space: nowrap;
    margin: 0 20px 0 0;
    padding: 7px;
    width: 100px;
    height: 100px;
    color: #ffffff;
    background-color: #000000;
    cursor: pointer;
}

.setting-tabs .item.active {
    background-color: #800000;
    color: #ffffff;
}

.setting-tabs .item .icon {
    height: 60px;
    line-height: 60px;
}

.setting-tabs .item .icon svg {
    width: 24px;
    height: 24px;
    vertical-align: middle;
}

.setting-content {
    padding: 0 16px;
}

/* ---------------------------------------------------------
   6. CONTAINER / SECTION / CARDS — 2013 base (no grid/vars)
   Row via inline-block; modern CSS grid lives in tv.css
   --------------------------------------------------------- */
.section-carousel-container,
.section-container,
.track-line-container {
    position: relative;
    display: block;
    width: 100%;
    clear: both;
}

.container {
    display: block;
    width: 100%;
    position: relative;
    overflow: hidden;
    margin: 0;
    padding: 0 8px;
    /* remove gaps between inline-block cards */
    font-size: 0;
    letter-spacing: 0;
}

/* song / album / default — ~4 per row */
.track-box,
.artist-box {
    display: inline-block;
    vertical-align: top;
    width: 23%;
    margin: 0 2% 16px 0;
    font-size: 16px;
    letter-spacing: normal;
    text-align: left;
}

/* video / musicvideo — ~3 per row (wider 16:9) */
.container.video .track-box {
    width: 31%;
    margin: 0 2% 16px 0;
}

.track-box .box,
.artist-box .box {
    display: block;
    position: relative;
    cursor: pointer;
}

.track-box .box a,
.artist-box a {
    display: block;
    text-decoration: none;
    color: inherit;
}

/* aspect ratio without CSS variables (padding-bottom trick) */
.ratio,
.artwork {
    position: relative;
    display: block;
    width: 100%;
    overflow: hidden;
    background-color: #2a2a2a;
}

.ratio-1x1 {
    height: 0;
    padding-bottom: 100%;
}

.ratio-16x9 {
    height: 0;
    padding-bottom: 56.25%;
}

.ratio-21x9 {
    height: 0;
    padding-bottom: 42.85%;
}

.ratio > img,
.ratio > span,
.artwork > img,
.artwork > span {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.artwork img {
    display: block;
    background-color: transparent !important;
    color: transparent !important;
}

.artwork .placeholder {
    background-color: #333333;
    color: #555555;
    font-size: 48px;
    line-height: 1;
    text-align: center;
}

.track-box .text1,
.track-box .text2,
.artist-box .text1,
.artist-box .text2 {
    display: block;
    margin-top: 6px;
    padding: 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    color: #ffffff;
}

.track-box .text2,
.artist-box .text2 {
    color: #a0a0a0;
    font-size: 13px;
}

.track-box .text1 a,
.track-box .text2 a,
.artist-box .text1 a,
.artist-box .text2 a {
    color: inherit;
    text-decoration: none;
}

.track-box .box a:focus .artwork,
.track-box .box a:hover .artwork,
.artist-box a:focus .artwork,
.artist-box a:hover .artwork {
    outline: 3px solid #ffffff;
}

/* ---------------------------------------------------------
   7. TRACK LINE
   --------------------------------------------------------- */
.track-line .track-cnt {
    height: 60px;
}

.track-line .track-cnt:hover,
.track-line .track-cnt:focus {
    background-color: red;
}

/* ---------------------------------------------------------
   8. NAV (bottom)
   --------------------------------------------------------- */
#nav {
    position: fixed;
    left: 3px;
    bottom: 3px;
    justify-items: center;
    text-align: -webkit-center;
}

#nav td {
    border: none;
}

#nav td div {
    line-height: 150px;
    background-color: transparent;
    width: 100%;
    border-radius: 50%;
}

#nav td div:hover,
#nav td div:focus {
    box-shadow: 0 0 0 2px white;
}

/* ---------------------------------------------------------
   9. ICONS / CSS MODULES (css-*)
   --------------------------------------------------------- */
.css-11ee1sb {
    display: inline-block;
    font-size: 1em;
    width: 1em;
    height: 1em;
    line-height: 1;
    margin: 0 2px;
}

.css-11ee1sb svg {
    width: 100%;
    height: 100%;
}

.css-lc3isr,
.css-1klrgra {
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    width: 100%;
    max-width: 100%;
    text-align: center;
    cursor: pointer;
    line-height: 1;
    color: #F1F1F1;
    padding: 5px;
    font-size: 1em;
    border-radius: 0.25rem;
}

.css-1klrgra {
    background-color: #292929;
}

.css-lc3isr .e1cooyvd1 {
    pointer-events: none;
    margin: 0;
    color: #ffffff;
    opacity: 0.75;
    width: 1.25em;
    height: 1.25em;
}

.css-1klrgra .e1cooyvd1 {
    display: inline-block;
    background-color: #f1f1f1;
    margin: 0;
    width: 1.25em;
    height: 1.25em;
    border-radius: 50%;
    -webkit-transform: scale(0.5);
    -moz-transform: scale(0.5);
    -ms-transform: scale(0.5);
    transform: scale(0.5);
    opacity: 0.75;
}

/* ---------------------------------------------------------
   10. MINI PLAYER / PLAYER CONTAINER
   --------------------------------------------------------- */
#player .bg-player {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

#mini-player {
    margin: 10px;
    width: 90px;
    height: 90px;
    background: url("https://hamrahang.ir/thumb/undefined.jpg") center center no-repeat;
    background-size: cover;
    border-radius: 50%;
}

#mini-player:hover,
#mini-player:focus {
    color: #800000;
    border-radius: 50%;
    outline: 3px #800000 solid;
}

#mini-player .thumbail.rotating img {
    -webkit-animation: spin-thumb 8s linear infinite;
    animation: spin-thumb 8s linear infinite;
    -webkit-animation-play-state: paused;
    animation-play-state: paused;
    border-radius: 50%;
    height: 100%;
    width: 100%;
    object-fit: cover;
    object-position: center;
}

@-webkit-keyframes spin-thumb {
    from { -webkit-transform: rotate(0deg); }
    to { -webkit-transform: rotate(360deg); }
}

@keyframes spin-thumb {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.play-pause {
    margin: 0 6px;
    cursor: pointer;
}

.play-pause:hover,
.play-pause:focus {
    color: #a70000;
    border-radius: 50%;
}

.play-pause span1 {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    width: 50px;
    height: 50px;
    padding: 0;
    margin: 0;
    background-color: #fff;
    font-size: 1.2rem;
    color: #000;
    border-radius: 50%;
    transition: all 0.3s ease;
}

.play-pause span1:hover {
    scale: 0.9;
}

.play-pause.loading .wlap {
    display: block;
}

.play-pause .wlap {
    display: none;
}

.player-container-desktop {
    grid-template-rows: 100px;
    position: fixed;
    right: 0;
    left: 0;
    bottom: 0;
    z-index: 10;
    height: 100px;
    padding: 0 1.5rem;
    background-color: var(--bs-body-bg);
    border-top: 1px solid hsla(0, 0%, 100%, 0.1);
    width: 100%;
    transition: 0.3s;
}

.player-container-mobile {
    grid-template-rows: 100px;
    z-index: 10;
    padding: 0 1rem;
    width: 100%;
    transition: 0.3s;
}

.maxminplayer {
    display: flex;
    justify-content: center;
    align-content: center;
    text-align: center;
    align-items: center;
    width: 30px;
    height: 22px;
    background-color: #000;
    position: absolute;
    top: -22px;
    right: 13px;
    padding: 0;
    border-radius: 5px 5px 0 0;
    border-top: 1px solid #a73537;
    border-left: 1px solid #a73537;
    border-right: 1px solid #a73537;
    -webkit-box-shadow: 0 0 2px 2px rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 2px 2px rgba(0, 0, 0, 0.5);
}

.wlap {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 9999px;
    position: fixed;
    border-width: 3px;
    border-style: solid;
    border-color: #3d3d3d #3d3d3d #ffffff;
    border-image: initial;
    animation: 0.8s linear 0s infinite normal none running spin;
}

.spin {
    animation: spin 2s linear infinite;
    animation-direction: reverse;
}

.spin-thumb {
    animation: 21s linear 0s infinite normal none running spin;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    to { transform: rotate(359deg); }
}

/* ---------------------------------------------------------
   11. PLAYER UI (titles, progress, controls)
   --------------------------------------------------------- */
.material-symbols-rounded {
    cursor: pointer;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 18px;
}

.top-bar .material-symbols-rounded {
    font-size: 24px;
}

.music-titles {
    text-align: center;
    margin: 30px 0;
    color: #d7d7d7;
}

.music-titles .name {
    font-size: 19px;
}

.music-titles .artist {
    font-size: 17px;
    margin-top: 3px;
    opacity: 0.9;
}

.progress-details {
    width: 100%;
    height: 7px;
    margin-top: 13px;
    background-color: #ccc;
    border-radius: 15px;
}

.progress-bar {
    width: 0%;
    height: inherit;
    border-radius: inherit;
    background-color: #ff0000;
    cursor: pointer;
    position: relative;
}

.progress-bar span {
    position: absolute;
    width: 16px;
    height: 16px;
    background-color: #ff0000;
    border-radius: inherit;
    -webkit-transform: translateY(-25%);
    -ms-transform: translateY(-25%);
    transform: translateY(-25%);
    right: -5px;
    opacity: 0;
    -webkit-transition: opacity 0.3s ease-out;
    transition: opacity 0.3s ease-out;
}

.progress-details:hover .progress-bar span,
.progress-details:focus .progress-bar span {
    opacity: 1;
    border: white 3px solid;
}

.time {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 7px;
}

.control-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.control-btn div {
    display: flex;
    align-items: center;
    justify-content: center;
}

.control-btn div:focus,
.control-btn div:hover {
    color: #ffffff;
    background-color: #a70000;
}

.control-btn .btn-repeat,
.control-btn .btn-shuffle {
    color: #777777;
}

.control-btn .btn.active {
    color: #ffffff;
}

/* ---------------------------------------------------------
   12. RANGE INPUT (seekbar style)
   --------------------------------------------------------- */
input:not(:last-child) {
    margin-bottom: 1.5em;
}

input[type="range"],
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
}

input[type="range"] {
    height: 0.5rem;
    border-radius: 0.25rem;
    background: #d7dcd3;
    background: linear-gradient(
        to right,
        #fc1748 0%,
        #fc1748 var(--value),
        #d7dcd3 var(--value),
        #d7dcd3 100%
    );
    outline: none;
    padding: 0;
    margin: 0.5em 0;
    display: block;
    -moz-appearance: none;
}

input[type="range"]:focus {
    border: 3px solid #d70647 !important;
}

input[type="range"]::-webkit-slider-thumb {
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease-in-out;
    background-color: #d70647;
    margin: -0.5em 0;
}

input[type="range"]::-moz-range-thumb {
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: #d70647;
    cursor: pointer;
    position: relative;
    margin: -0.5em 0;
    transition: background 0.15s ease-in-out;
}

input[type="range"]::-ms-thumb {
    width: 1rem;
    height: 1rem;
    border: 0;
    margin: 0;
    border-radius: 50%;
    background: #d70647;
    cursor: pointer;
}

/* ---------------------------------------------------------
   19. HPOP - unified popup (setting style)
   Used by CRBW (item menus, alerts, messages) and later by
   the fullscreen player setting. Plain block layout only
   (no flex/grid), so it also works on old TV browsers.
   --------------------------------------------------------- */
.hpop-wrap {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 2500;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    -webkit-transition: opacity 0.2s;
    transition: opacity 0.2s;
}

.hpop-wrap.hpop-show {
    opacity: 1;
}

.hpop {
    position: absolute;
    top: 12%;
    left: 50%;
    width: 700px;
    margin-left: -350px;
    border-radius: 10px;
    background: #1f1f1f;
    color: #ffffff;
    overflow: hidden;
}

.hpop-head {
    position: relative;
    min-height: 50px;
    padding: 10px 60px 10px 20px;
    background-color: #a70000;
    overflow: hidden;
}

.hpop-art {
    position: relative;
    float: left;
    width: 50px;
    height: 50px;
    margin-right: 15px;
    border-radius: 6px;
    background: #7d0000;
    overflow: hidden;
}

.hpop-art .hpop-art-ph svg {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 30px !important;
    height: 30px !important;
    margin: 0 !important;
}

.hpop-art img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hpop-texts {
    overflow: hidden;
    line-height: 25px;
}

.hpop-title {
    font-size: 1.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-sub {
    font-size: 1rem;
    color: #f0c0c0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    line-height: 26px;
    text-align: center;
    border: 2px solid #a70000;
    background: transparent;
    color: #ffffff;
    font-size: 20px;
    cursor: pointer;
}

.hpop-close:hover,
.hpop-close:focus {
    border-radius: 10px;
    border-color: #ffffff;
    outline: none;
}

.hpop-body {
    max-height: 60vh;
    padding: 10px;
    overflow-y: auto;
}

.hpop-item {
    position: relative;
    height: 45px;
    line-height: 45px;
    padding: 0 10px;
    margin-top: 5px;
    border-radius: 4px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-item svg {
    vertical-align: middle;
    margin-top: -3px;
}

.hpop-item:hover,
.hpop-item:focus,
.hpop-item.focused {
    background: #a70007;
    outline: none;
}

.hpop-info {
    color: #bbbbbb;
    cursor: default;
}

.hpop-info:hover {
    background: transparent;
}

.hpop-text {
    padding: 10px;
    font-size: 1.2rem;
    line-height: 1.8;
}

.hpop-actions {
    padding-top: 10px;
    text-align: center;
}

.hpop-btn {
    display: inline-block;
    min-width: 120px;
    height: 40px;
    line-height: 40px;
    padding: 0 20px;
    margin: 0 8px;
    border: 2px solid transparent;
    border-radius: 6px;
    background: #414141;
    color: #ffffff;
    text-align: center;
    cursor: pointer;
}

.hpop-btn-primary {
    background: #a70000;
}

.hpop-btn:hover,
.hpop-btn:focus {
    border-color: #ffffff;
    outline: none;
}

.hpop-cols {
    white-space: nowrap;
}

.hpop-cols .setting-column {
    cursor: default;
}

/* Item popup (CRBW): left = cover + texts, right = icon boxes */
.hpop-split {
    overflow: hidden;
}

.hpop-left {
    float: left;
    width: 210px;
    padding: 5px 10px 15px 5px;
    text-align: center;
}

.hpop-cover {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto;
    border-radius: 8px;
    background: #7d0000;
    overflow: hidden;
}

.hpop-cover img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    -o-object-fit: cover;
    object-fit: cover;
}

.hpop-side-name {
    margin-top: 10px;
    font-size: 1.3rem;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-side-artist {
    margin-top: 4px;
    color: #f0c0c0;
    font-size: 1rem;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-side-plays {
    margin-top: 6px;
    color: #bbbbbb;
    font-size: 0.95rem;
}

.hpop-right {
    margin-left: 230px;
    padding: 5px 5px 15px 10px;
    overflow: hidden;
}

.hpop-box-row {
    overflow: hidden;
}

.hpop-box {
    position: relative;
    float: left;
    width: 92px;
    height: 92px;
    margin: 0 10px 10px 0;
    border-radius: 8px;
    background: #2b2b2b;
    color: #ffffff;
    text-align: center;
    cursor: pointer;
}

.hpop-box-ico {
    padding-top: 18px;
    text-align: center;
    text-align: -webkit-center;
}

.hpop-box-ico svg {
    display: inline-block !important;
    width: 30px !important;
    height: 30px !important;
    margin: 0 !important;
}

.hpop-box-lb {
    margin-top: 8px;
    padding: 0 4px;
    font-size: 0.95rem;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hpop-box-wide {
    float: none;
    width: auto;
    height: 52px;
    margin: 0 0 10px 0;
    overflow: hidden;
    text-align: left;
}

.hpop-box-wide .hpop-box-ico {
    float: left;
    width: 52px;
    padding-top: 11px;
    text-align: center;
    text-align: -webkit-center;
}

.hpop-box-wide .hpop-box-lb {
    margin-top: 0;
    padding: 0 10px 0 4px;
    line-height: 52px;
    font-size: 1.05rem;
}

.hpop-box:hover,
.hpop-box:focus,
.hpop-box.focused {
    background: #a70007;
    outline: none;
}

/* Toasts must stay visible above the popup */
.toast-message {
    z-index: 3000;
}

                var evt = document.createEvent('Event');
        
                evt.initEvent('keydown', true, true);
                evt.keyCode = keyCode;
                evt.which = keyCode;
        
                var target = document.activeElement || window;
                target.dispatchEvent(evt);
            }

                    target = target.parentNode;
                }

                    return;

    function UARDB(type, ar) {
    
        var i;
        var item;
        var itemId;
        var ids = [];
    
        if (typeof SN === 'undefined' || !SN) { return ids; }
        if (!type || typeof type !== 'string') { return ids; }
        if (!ar || !Array.isArray(ar)) { return ids; }
    
        if (!SN[type] || typeof SN[type] !== 'object' || Array.isArray(SN[type])) {
            SN[type] = {};
        }
    
        for (i = 0; i < ar.length; i++) {
    
            item = ar[i];
    
            // اگه آیتم یک آبجکت با id باشه از همون id استفاده کن،
            // اگه خود آیتم مستقیماً id (رشته/عدد) باشه همونو به‌عنوان id در نظر بگیر
            if (item && typeof item === 'object' && item.id) {
                itemId = item.id;
            } else if (typeof item === 'string' || typeof item === 'number') {
                itemId = item;
            } else {
                continue;
            }
    
            if (ids.indexOf(itemId) === -1) {
                ids.push(itemId);
            }
    
            // فقط وقتی آیتم کامل (آبجکت) باشه در دیتابیس ذخیره/merge کن
            if (typeof item === 'object' && item.id) {
                if (!SN[type][itemId]) {
                    SN[type][itemId] = item;
                    //console.log("New " + type + " Added:", itemId);
                } else {
                    for (var k in item) {
                        if (item.hasOwnProperty(k)) {
                            SN[type][itemId][k] = item[k];
                        }
                    }
                }
            }
        }
    
        return ids;
    }

    function gjs(U, callback) {
    
        if (!U || !Array.isArray(U) || U.length < 2) {
            console.error('gjs: Invalid request params', U);
            if (callback) {callback(false, null);}
            return;
        }
    
        var xhr = new XMLHttpRequest();
        var url = HP + U[0] + '/' + U[1] + '?_qjs=ep';
    
        xhr.open('GET', url, true);
    
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) {return;}
            if (xhr.status >= 200 && xhr.status < 300) {
    
                try {
                    var jd = JSON.parse(xhr.responseText);
                    
                    if (!jd || typeof jd !== 'object') {
                        console.error('gjs: Invalid JSON response', jd);
                        if (callback) {callback(false, null);}
                        return;
                    }
                    
                    if (jd.video) {
                        UVID(['video', jd.video]);
                    } else if (jd.musicvideo) {
                        UVID(['video', jd.musicvideo]);
                    } else if (jd.song) {
                        USNG(['song', jd.song]);
                    } else if (jd.podcast) {
                        USNG(['song', jd.podcast]);
                    } else if (jd.artist) {
                        UART(['artist', jd.artist]);
                    } else if (jd.album) {
                        ULBM(['album', jd.album]);
                    } else if (jd.search) {
                        USRC(['search', jd.search]);
                    } else {
                        UHOM([U,jd]);
                    }

                    if (callback) {callback(true, jd);}
    
                } catch (error) {
                    console.error(error.message || error);
                    if (callback) {callback(false, null);}
                }
    
            } else {
                console.error('Response status: ' + xhr.status);
                if (callback) {callback(false, null);}
            }
        };
    
        xhr.onerror = function () {
            console.error('Network error');
            if (callback) {callback(false, null);}
        };
    
        xhr.send(null);
    }

    function CheckLoginStatus(onUpdate) {

        var did = GetOrCreateDeviceId();
        var refreshToken = null;
        var cachedUser = null;
    
        try {
            refreshToken = localStorage.getItem('hamrahang_refresh_token');
            var cachedUserRaw = localStorage.getItem('hamrahang_user');
            if (cachedUserRaw) {
                cachedUser = JSON.parse(cachedUserRaw);
            }
        } catch (e) {}
    
        // قدم اول: اگه قبلاً یوزر cache شده، فوری و بدون انتظار شبکه نمایشش بده
        if (cachedUser && refreshToken) {
            SN.user = cachedUser;
            SN.user.loggedIn = true;
        } else {
            SN.user = { loggedIn: false };
        }
    
        if (!refreshToken) {
            if (onUpdate) { onUpdate(); }
            return;
        }
    
        // قدم دوم: در پس‌زمینه، از سرور تأیید/تازه‌سازی کن
        gjl({ a: 'refresh_session', refresh_token: refreshToken, did: did }, function (success, j) {
    
            if (!success || !j || !j.access_token) {
                // سشن دیگه معتبر نیست → لاگ‌اوت خاموش
                SN.user = { loggedIn: false };
                try {
                    localStorage.removeItem('hamrahang_refresh_token');
                    localStorage.removeItem('hamrahang_user');
                } catch (e) {}
    
                if (onUpdate) { onUpdate(); }
                return;
            }
    
            SN.accessToken = j.access_token;
    
            try {
                localStorage.setItem('hamrahang_refresh_token', j.refresh_token);
            } catch (e) {}

            // Soft pull مثل CheckLoginStatus در ha.php (بدون پاپ‌آپ؛ فقط merge سرور→لوکال)
            FetchServerFavorites(function (serverFav) {
                if (serverFav) { MergeServerFavoritesIntoLocal(serverFav); }
            });
            FetchServerHistory(function (serverList) {
                if (serverList) { MergeServerHistoryIntoLocal(serverList); }
            });
    
            if (onUpdate) { onUpdate(); }
        });
    }
    
    function GenerateRandomToken(bytes) {
        var arr = new Uint8Array(bytes);
        if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(arr);
        } else {
            for (var i = 0; i < bytes; i++) { arr[i] = Math.floor(Math.random() * 256); }
        }
        var hex = '';
        for (var j = 0; j < arr.length; j++) { hex += ('0' + arr[j].toString(16)).slice(-2); }
        return hex;
    }

    function PollTVLoginStatus(code, onSuccess) {
    
        if (currentLoginPoll) {
            clearInterval(currentLoginPoll);
        }
    
        var did = GetOrCreateDeviceId();
    
        currentLoginPoll = setInterval(function () {
    
            gjl({ a: 'check_code', code: code, did: did, device_type: 'tv_webapp' }, function (success, j) {
    
                if (!success || !j) { return; }
    
                if (j.status === 'confirmed' && j.access_token) {
    
                    clearInterval(currentLoginPoll);
                    currentLoginPoll = null;
    
                    PersistUserSession({
                        id: j.id_user,
                        name: j.user_name || '',
                        first_name: j.first_name || '',
                        last_name: j.last_name || '',
                        email: j.email || '',
                        act: j.act,
                        devices: j.devices || []
                    }, j.access_token, j.refresh_token);
    
                    if (onSuccess) { onSuccess(); }
    
                } else if (j.status === 'expired') {
    
                    clearInterval(currentLoginPoll);
                    currentLoginPoll = null;
                    console.log("PollTVLoginStatus: code expired");
                }
            });
    
        }, 3000);
    }

                thumb = song.meta && song.meta.tmb ? song.meta.tmb : '';

    function getQueryParam(search, name) {
    
        if (!search) {
            return null;
        }
    
        search = search.substring(1);
    
        var params = search.split('&');
    
        for (var i = 0; i < params.length; i++) {
    
            var pair = params[i].split('=');
    
            if (decodeURIComponent(pair[0]) === name) {
    
                return pair.length > 1
                    ? decodeURIComponent(pair.slice(1).join('='))
                    : '';
            }
        }
    
        return null;
    }

    /* =========================================================
       USER DATA SYNC — ES5 port of ha.php logic
       Local:  localStorage 'ha_profile' via LoadProfile/SaveProfile
       Server: uac actions get_favorites / sync_favorites /
               get_history / sync_history (sync فقط وقتی لاگینه)
       ========================================================= */
    var HISTORY_MAX = 50;

    function FetchServerFavorites(cb) {
        gja({ a: 'get_favorites' }, function (success, j) {
            cb((success && j && !j.error && j.favorites) ? j.favorites : null);
        });
    }

    // فقط اضافه کن — هیچی رو پاک نکن (دقیقاً مثل ha.php)
    function MergeServerFavoritesIntoLocal(serverFav) {
        if (!serverFav) { return 0; }
        LoadProfile();

        var added = 0;
        var types = ['song', 'artist', 'album', 'video', 'musicvideo', 'podcast', 'playlist'];

        for (var i = 0; i < types.length; i++) {
            var t = types[i];
            var serverList = Array.isArray(serverFav[t]) ? serverFav[t] : [];
            if (!Array.isArray(SN.profile.favorite[t])) { SN.profile.favorite[t] = []; }
            var local = SN.profile.favorite[t];

            for (var k = 0; k < serverList.length; k++) {
                if (local.indexOf(serverList[k]) === -1) {
                    local.push(serverList[k]);
                    added++;
                }
            }
        }

        if (added > 0) { SaveProfile(); }
        return added;
    }

    function FetchServerHistory(cb) {
        gja({ a: 'get_history' }, function (success, j) {
            cb((success && j && !j.error && Array.isArray(j.history)) ? j.history : null);
        });
    }

    // merge تاریخچه: جدیدترین برنده، سقف ۵۰ ردیف هر type (مثل ha.php)
    function MergeServerHistoryIntoLocal(serverList) {
        if (!Array.isArray(serverList)) { return; }
        LoadProfile();
        if (!Array.isArray(SN.profile.history)) { SN.profile.history = []; }

        var map = {};
        var order = [];

        function keyOf(id, type) { return String(type) + ':' + String(id); }
        function put(row) {
            var k = keyOf(row.id, row.type);
            if (!map[k]) { order.push(k); }
            map[k] = row;
        }

        var i;
        var row;
        for (i = 0; i < SN.profile.history.length; i++) {
            row = SN.profile.history[i];
            if (row && row.id != null) {
                put({ id: row.id, type: row.type || 'song', at: row.at || 0 });
            }
        }

        for (i = 0; i < serverList.length; i++) {
            row = serverList[i];
            if (!row || row.id == null) { continue; }
            var st = row.type || 'song';
            if (!IsPlayableType(st)) { continue; }
            var k = keyOf(row.id, st);
            var at = row.at || 0;
            if (!map[k] || at >= (map[k].at || 0)) {
                put({ id: row.id, type: st, at: at });
            }
        }

        var merged = [];
        for (i = 0; i < order.length; i++) { merged.push(map[order[i]]); }
        merged.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });

        var counts = {};
        var capped = [];
        for (i = 0; i < merged.length; i++) {
            var mt = merged[i].type || 'song';
            counts[mt] = (counts[mt] || 0) + 1;
            if (counts[mt] <= HISTORY_MAX) { capped.push(merged[i]); }
        }

        SN.profile.history = capped;
        SaveProfile();
    }

    // آیا این دستگاه داده‌ای دارد که ارزش سینک داشته باشد؟
    function HasLocalDataToSync() {
        LoadProfile();

        var fav = SN.profile.favorite || {};
        for (var t in fav) {
            if (fav.hasOwnProperty(t) && Array.isArray(fav[t]) && fav[t].length) {
                return true;
            }
        }

        if (Array.isArray(SN.profile.history) && SN.profile.history.length) {
            return true;
        }

        return false;
    }

    function PushLocalFavoritesToServer(cb) {

    function ManualSyncFavorites(cb) {
        FetchServerFavorites(function (serverFav) {

    function PushLocalHistoryToServer(cb) {
        LoadProfile();
        var hist = Array.isArray(SN.profile.history) ? SN.profile.history : [];
        var items = [];

        for (var i = 0; i < hist.length; i++) {

            if (row && row.id != null) {
                items.push({ id: row.id, type: row.type || 'song', at: row.at || now });

        }

        if (!items.length) { cb(true); return; }
        gja({ a: 'sync_history', items: items }, function (success, j) {
            cb(!!(success && j && !j.error));
        });
    }

    // ترتیب ha.php بعد از لاگین: pull سرور→لوکال، بعد اگر دادهٔ لوکال بود → انتخاب سینک
    function AfterLoginSyncFlow(pane) {
        function rerender() {
            if (pane) { RerenderAccountPane(pane); }
        }

        if (!SN.user || !SN.user.loggedIn || !SN.accessToken) { rerender(); return; }

        FetchServerFavorites(function (serverFav) {
            if (serverFav) { MergeServerFavoritesIntoLocal(serverFav); }

            FetchServerHistory(function (serverList) {
                if (serverList) { MergeServerHistoryIntoLocal(serverList); }

                if (!HasLocalDataToSync()) { rerender(); return; }

                ShowSyncPrompt(function (didSync) {
                    if (!didSync) { rerender(); return; }

                    ManualSyncFavorites(function () {
                        PushLocalHistoryToServer(function () {
                            rerender();
                        });
                    });
                });
            });
        });
    }

    // مثل ha.php pushPlayHistory: لوکال + sync بی‌صدا سرور (فقط موقع لاگین)
    function PushPlayHistory(id, type) {
        if (id == null || !type) { return; }
        if (!IsPlayableType(type)) { return; }

        var at = Math.floor(Date.now() / 1000);

        LoadProfile();
        if (!Array.isArray(SN.profile.history)) { SN.profile.history = []; }

        var out = [];
        var i;
        for (i = 0; i < SN.profile.history.length; i++) {
            var row = SN.profile.history[i];
            if (row && !(Number(row.id) === Number(id) && (row.type || 'song') === type)) {
                out.push(row);
            }
        }
        out.unshift({ id: id, type: type, at: at });

        var counts = {};
        var capped = [];
        for (i = 0; i < out.length; i++) {
            var t = out[i].type || 'song';
            counts[t] = (counts[t] || 0) + 1;
            if (counts[t] <= HISTORY_MAX) { capped.push(out[i]); }
        }

        SN.profile.history = capped;
        SaveProfile();

        if (SN.user && SN.user.loggedIn && SN.accessToken) {
            gja({ a: 'sync_history', items: [{ id: id, type: type, at: at }] }, function (success, j) {
                if (!success || (j && j.error)) { console.log('PushPlayHistory: server sync skipped'); }
            });
        }
    }

    /* ---- resolve آیتم‌های گمشده مثل EnsureItems در ha.php (ES5/callback) ---- */
    function MergeResolvedItems(endpoint, items) {
        if (!Array.isArray(items)) { return; }
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            if (!item || item.id == null) { continue; }
            if (Array.isArray(item.artists)) { item.artists = UARDB('artist', item.artists); }

            if (endpoint === 'song') {
                UARDB((item.meta && item.meta.type === 'podcast') ? 'podcast' : 'song', [item]);
            } else if (endpoint === 'video') {
                UARDB((item.meta && item.meta.type === 'video') ? 'video' : 'musicvideo', [item]);
            } else {
                UARDB(endpoint, [item]);
            }
        }
    }

    function ResolveItems(type, ids, cb) {
        ids = ids || [];
        if (!ids.length) { cb([]); return; }

        var endpoint = (type === 'podcast') ? 'song'
                     : (type === 'musicvideo' || type === 'video') ? 'video'
                     : type;

        function isPresent(id) {
            if (type === 'song' || type === 'podcast') {
                return !!((SN.song && SN.song[id]) || (SN.podcast && SN.podcast[id]));
            }
            if (type === 'video' || type === 'musicvideo') {
                return !!((SN.video && SN.video[id]) || (SN.musicvideo && SN.musicvideo[id]));
            }
            return !!(SN[type] && SN[type][id]);
        }

        var done = false;
        var attempts = 0;

        // فقط یک بار callback می‌دهد؛ قبلاً onerror + onreadystatechange هر دو finish()
        // را صدا می‌زدند و بخش/پیام خالی دوبار ساخته می‌شد
        function finish() {
            if (done) { return; }
            done = true;
            var ready = [];
            var k;
            for (k = 0; k < ids.length; k++) {
                if (isPresent(ids[k])) { ready.push(ids[k]); }
            }
            cb(ready);
        }

        function missingNow() {
            var out = [];
            var k;
            for (k = 0; k < ids.length; k++) {
                if (!isPresent(ids[k])) { out.push(ids[k]); }
            }
            return out;
        }

        function send() {
            // در لند مستقیم، resolve با preload ها مسابقه می‌دهد؛ شاید آیتم‌ها
            // همین‌طوری کش شده باشند — دوباره چک کن، نیازی به XHR نیست
            var missing = missingNow();
            if (!missing.length) { finish(); return; }

            var xhr = new XMLHttpRequest();
            xhr.open('POST', HP + endpoint + '/resolve?_qjs=ep', true);
            // text/plain → بدون CORS preflight (مثل درخواست‌های ساده) تا لند مستقیم
            // از دامنه‌ی دیگر هم کار کند؛ سرور php://input را فارغ از content-type می‌خواند
            xhr.setRequestHeader('Content-Type', 'text/plain; charset=UTF-8');

            var settled = false;
            function retryOrFinish() {
                if (settled || done) { return; }
                settled = true;
                if (attempts < 2) {
                    attempts++;
                    setTimeout(send, 700);
                } else {
                    finish();
                }
            }

            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        MergeResolvedItems(endpoint, JSON.parse(xhr.responseText));
                        finish();
                    } catch (e) {
                        console.log('ResolveItems: parse failed', e.message);
                        retryOrFinish();
                    }
                } else {
                    retryOrFinish();
                }
            };
            xhr.onerror = function () { retryOrFinish(); };
            xhr.send(JSON.stringify({ ids: missing }));
        }

        send();
    }

	// ------------------------------------------------------------------
    // CTAB - generic tab builder (ES5)
    // o.types       : [{key, label, icon, href, render}]  (already filtered)
    // o.mode        : 'pane' (default) = every tab owns a pane, click/focus switches panes
    //                 'link'           = tabs are links, only the active type is rendered
    // o.active      : key of the active tab (default: first)
    // o.host        : element that receives the tab bar (default MCNT)
    // o.contentHost : element that receives the panes container (default host)
    // o.barClass / o.contentClass / o.itemClass : CSS class overrides
    // o.onFocus     : also switch pane on focus (D-pad), not only on click
    // Returns {bar, tabs, panes, index, activate}
    // ------------------------------------------------------------------
    function CTAB(o) {

        var host = o.host || MCNT;
        var types = o.types || [];
        var mode = o.mode || 'pane';
        var itemCls = o.itemClass || 'item focusable';
        var tabs = [];
        var panes = [];
        var res = {bar: null, tabs: tabs, panes: panes, index: -1, activate: function () {}};
        var i, t, el, ic, sp, pane, oldMCNT, content;

        if (!types.length) { return res; }

        var index = 0;
        for (i = 0; i < types.length; i++) {
            if (types[i].key === o.active) { index = i; break; }
        }

        var bar = OA(document.createElement("div"), {className: o.barClass || "main-tabs m-top-1"});
        host.appendChild(bar);

        if (mode === 'pane') {
            content = OA(document.createElement("div"), {className: o.contentClass || "tab-content"});
            (o.contentHost || host).appendChild(content);
        }

        function activate(n) {
            var j;
            for (j = 0; j < tabs.length; j++) {
                tabs[j].className = itemCls + (j === n ? " active" : "");
                if (panes[j]) { panes[j].style.display = (j === n) ? "block" : "none"; }
            }
            res.index = n;
        }

        for (i = 0; i < types.length; i++) {
            t = types[i];

            el = OA(document.createElement(t.href ? "a" : "div"), {className: itemCls + (i === index ? " active" : "")});
            if (t.href) { el.href = t.href; }

            if (t.icon) {
                ic = OA(document.createElement("div"), {className: "icon", innerHTML: t.icon});
                sp = OA(document.createElement("span"), {innerHTML: t.label});
                el.appendChild(ic);
                el.appendChild(sp);
            } else {
                el.innerHTML = t.label;
            }
            bar.appendChild(el);
            tabs.push(el);

            if (mode === 'pane') {
                pane = OA(document.createElement("div"), {className: "tab-pane"});
                pane.style.display = (i === index) ? "block" : "none";
                content.appendChild(pane);
                panes.push(pane);

                if (t.render) {
                    oldMCNT = MCNT;
                    MCNT = pane;
                    t.render(pane);
                    MCNT = oldMCNT;
                }
            } else if (i === index && t.render) {
                t.render();
            }
        }

        if (mode === 'pane') {
            for (i = 0; i < tabs.length; i++) {
                (function (n) {
                    tabs[n].addEventListener("click", function () { activate(n); }, false);
                    if (o.onFocus) {
                        tabs[n].addEventListener("focus", function () { activate(n); }, false);
                    }
                })(i);
            }
        }

        res.bar = bar;
        res.index = index;
        res.activate = activate;
        return res;
    }

    function CreateQualityList(currentValue, onSelect) {

        var options = [

            { value: 'medium', label: 'Medium' },
            { value: 'low',    label: 'Lowest' }

                className: "quality-item focusable" + (isActive ? " active" : ""),
                innerHTML: opt.label
            });
    
            item._value = opt.value;
            items.push(item);
    
            function selectThis() {
    
                for (var i = 0; i < items.length; i++) {
                    items[i].classList.remove("active");
                }
    
                item.classList.add("active");
    
                if (onSelect) { onSelect(opt.value); }
            }
    
            item.addEventListener("click", selectThis);
            item.addEventListener("focus", selectThis);
    
            container.appendChild(item);
        });
    
        return container;
    }

        var routeMap = {
            'video_top':      { a: 1, key: 'top_video',      fetch: ['video', 'top'] },
            'video_latest':   { a: 2, key: 'latest_video',   fetch: ['video', 'latest'] },
            'song_top':       { a: 3, key: 'top_song',       fetch: ['song', 'top'] },
            'song_featured':  { a: 4, key: 'featured_song',  fetch: ['song', 'featured'] },
            'song_latest':    { a: 5, key: 'latest_song',    fetch: ['song', 'latest'] },
            'song_trending':  { a: 5, key: 'latest_song',    fetch: ['song', 'latest'] },
            'song_popular':   { a: 5, key: 'latest_song',    fetch: ['song', 'latest'] },
            'artist_top':     { a: 6, key: 'top_artist',     fetch: ['artist', 'top'] }
        };
    
        // مسیرهای اختصاصی (جزئیات یک آیتم، نه لیست) که خودشون fetch مستقل دارن
        if (P == 'video' && !routeMap['video_' + QS]) {
            CRVP(QS, callback);
            return;
        }
        if (P == 'song' && !routeMap['song_' + QS]) {
            CREP('song', QS, callback);
            return;
        }
        if (P == 'album') {
            CREP('album', QS, callback);
            return;
        }
        if (P == 'artist' && !routeMap['artist_' + QS]) {
            CREP('artist', QS, callback);
            return;
        }
    
        var routeKey = P + '_' + QS;
        var route = routeMap[routeKey];
    
        if (!route) {
            console.log("CRHP: Unknown route:", P, QS);
            renderPage(0, null);
            if (callback) {callback();}
            return;
        }
    
        // اگه داده از قبل موجوده، مستقیم رندر کن
        if (SN[route.key] && SN[route.key].length) {
            renderPage(route.a, SN[route.key]);
            if (callback) {callback();}
            return;
        }
    
        // وگرنه خودش fetch کنه و بعد رندر کنه
        gjs(route.fetch, function () {
            renderPage(route.a, SN[route.key]);
            if (callback) {callback();}

    // داده‌های کاربر از SN.profile مثل getUserData در ha.php
    function LIB_getData(source, itemType) {
        if (!SN.profile) { return null; }

        if (source === 'history') {
            var list = Array.isArray(SN.profile.history) ? SN.profile.history : [];
            var out = [];
            for (var i = 0; i < list.length; i++) {
                var row = list[i];
                if (!row || row.id == null) { continue; }
                if (!itemType || String(row.type || 'song') === String(itemType)) {
                    out.push(row.id);
                }
            }
            return out;
        }

        if (source === 'favorite') {
            return (SN.profile.favorite && Array.isArray(SN.profile.favorite[itemType])) ? SN.profile.favorite[itemType] : [];
        }

        // سازگاری با فرمت قدیمی 'favorite.song'
        if (source.indexOf('favorite.') === 0) {
            var t = source.slice(9);
            return (SN.profile.favorite && Array.isArray(SN.profile.favorite[t])) ? SN.profile.favorite[t] : [];
        }

        return null;
    }

    /* =========================================================
       /library — مثل صفحهٔ هوم: هیرو + منوی افقی + کاروسل بخش
       فعال. داده‌ها از SN.profile (علاقه‌مندی‌ها و تاریخچه)،
       آیتم‌های گمشده با resolve از سرور پر می‌شن.
       ========================================================= */

    // هر بار chp صفحه جدیدی می‌سازد؛ callback های resolveِ رندرهای قدیمی
    // باید بی‌اثر شوند وگرنه کاروسلِ تب قبلی به صفحهٔ جدید اضافه می‌شود
    var LIB_RENDER_TOKEN = 0;

    function LIB_RenderType(type, ids) {
        if (!ids || !ids.length) { return; }
        if (type === 'artist') { CRAS(ids); }
        else if (type === 'video') { CRVN(ids, 'video'); }
        else if (type === 'musicvideo') { CRVN(ids, 'musicvideo'); }
        else if (type === 'album') { CRSS(ids, 'album'); }
        else { CRSS(ids, 'song'); }
    }

    function CRLB(P, S, callback) {

        LoadProfile();

        var myToken = ++LIB_RENDER_TOKEN;

        // نظم تب‌ها: Played Videos ← Recently Played ← Your Favorite (سانگ)
        // ← Your Video ← Your Followed (ارتیست) ← Your Bookmark (آلبوم)
        var sections = [
            { key: 'history_video',   label: 'Played Videos',   source: 'history',  types: ['video', 'musicvideo'] },
            { key: 'history_song',    label: 'Recently Played', source: 'history',  types: ['song'] },
            { key: 'favorite_song',   label: 'Your Favorite',   source: 'favorite', types: ['song'] },
            { key: 'favorite_video',  label: 'Your Video',      source: 'favorite', types: ['video', 'musicvideo'] },
            { key: 'favorite_artist', label: 'Your Followed',   source: 'favorite', types: ['artist'] },
            { key: 'favorite_album',  label: 'Your Bookmark',   source: 'favorite', types: ['album'] }
        ];

        // فقط بخش‌هایی که واقعاً داده دارن نمایش داده می‌شن (مثل renderLibrary در ha.php)
        var active = [];
        var i;
        var t;
        for (i = 0; i < sections.length; i++) {
            var idsByType = {};
            var total = 0;
            for (t = 0; t < sections[i].types.length; t++) {
                var typeIds = LIB_getData(sections[i].source, sections[i].types[t]) || [];
                if (typeIds.length) {
                    idsByType[sections[i].types[t]] = typeIds;
                    total += typeIds.length;
                }
            }
            if (total > 0) {
                sections[i].idsByType = idsByType;
                active.push(sections[i]);
            }
        }

        if (!active.length) {
            var dtx = OA(document.createElement("div"), {className: "error-message-container"});
            var tx1 = OA(document.createElement("div"), {className: "text1 m-top-1-5", innerHTML: "Library is empty"});
            var tx2 = OA(document.createElement("div"), {className: "text2", innerHTML: (SN.user && SN.user.loggedIn) ? "هنوز چیزی به کتابخانه اضافه نکرده‌اید" : "برای دیدن کتابخانه وارد حساب شوید"});
            var btn = OA(document.createElement("button"), {className: "btn btn-sm btn-model-4 m-top-1-5", type: "button", innerHTML: "Back to home"});
            dtx.appendChild(tx1);
            dtx.appendChild(tx2);
            dtx.appendChild(btn);
            MCNT.appendChild(dtx);
            btn.addEventListener("click", function () {
                chp(HP);
            });
            ADE();
            if (callback) { callback(); }
            return;
        }

        // بخش فعال از روی مسیر /library/<key>؛ وگرنه اولین بخش موجود
        var current = null;
        for (i = 0; i < active.length; i++) {
            if (active[i].key === P) { current = active[i]; }
        }
        if (!current) { current = active[0]; }

        // HERO مثل هوم — با فوکوس روی کارت‌ها آپدیت می‌شه (UHERO داخل رندررها)
        var hero = OA(document.createElement("div"), {className: "page-detail-header-container", id: "hero"});
        MCNT.appendChild(hero);

        // منوی افقی مثل main-tabs هوم — هر آیتم یک بخش از داده‌های کاربر
        var tab = OA(document.createElement("div"), {className: "main-tabs m-top-1"});
        for (i = 0; i < active.length; i++) {
            (function (sec) {
                var item = OA(document.createElement("a"), {
                    className: "item" + (sec.key === current.key ? " active" : ""),
                    href: "/library/" + sec.key,
                    innerHTML: sec.label
                });
                tab.appendChild(item);
            })(active[i]);
        }
        MCNT.appendChild(tab);

        // رندر بخش فعال: اول type های گمشده resolve، بعد کاروسل هر type
        var typesToResolve = [];
        for (t = 0; t < current.types.length; t++) {
            if (current.idsByType[current.types[t]]) { typesToResolve.push(current.types[t]); }
        }

        var remaining = typesToResolve.length;
        var readyByType = {};

        function onAllResolved() {
            remaining--;
            if (remaining > 0) { return; }
            if (myToken !== LIB_RENDER_TOKEN) { return; } // صفحه عوض شده؛ رندر نکن

            var any = false;
            var k;

    /* =========================================================
       Thumb helpers (ES5) — synced with ha.php resolveThumb
       - video / musicvideo grids & boxes: tmv then tmb
       - other types: tmb (then artist fallback)
       - hero bg (video / musicvideo only): art then tmv; else none
       ========================================================= */
    /**
     * @param {object} e        item
     * @param {string|number} [ART]  preferred artist id for fallback
     * @param {string} [typeHint]    'video' | 'musicvideo' | ... when meta.type missing
     */
    function resolveThumb(e, ART, typeHint) {
        var isVideoish =
            typeHint === "video" ||
            typeHint === "musicvideo" ||
            (e && e.type === "video") ||
            (e && e.type === "musicvideo") ||
            (e && e.meta && (e.meta.type === "video" || e.meta.type === "musicvideo"));

        if (e && e.meta) {
            if (isVideoish) {
                if (e.meta.tmv) { return e.meta.tmv; }
                if (e.meta.tmb) { return e.meta.tmb; }
            } else if (e.meta.tmb) {
                return e.meta.tmb;
            }
        }

        if (ART != null && SN.artist && SN.artist[ART]) {
            var a0 = SN.artist[ART];
            if (a0.meta && a0.meta.tmb) { return a0.meta.tmb; }
        }

        var refs = (e && Array.isArray(e.artists)) ? e.artists : [];
        var i, aid, a;
        for (i = 0; i < refs.length; i++) {
            aid = (typeof refs[i] === "object") ? refs[i].id : refs[i];
            if (aid == null || !SN.artist || !SN.artist[aid]) { continue; }
            a = SN.artist[aid];
            if (a.meta && a.meta.tmb) { return a.meta.tmb; }
        }
        return null;
    }

    function resolveThumbUrl(e, ART, typeHint) {
        var t = resolveThumb(e, ART, typeHint);
        return t ? (UT + t + ".jpg") : "";
    }

    /** Hero background for video / musicvideo only: art → tmv → nothing */
    function resolveHeroBg(e) {
        if (!e || !e.meta) { return null; }
        if (e.meta.art) { return e.meta.art; }
        if (e.meta.tmv) { return e.meta.tmv; }
        return null;
    }

    function resolveHeroBgUrl(e) {
        var t = resolveHeroBg(e);
        return t ? (UT + t + ".jpg") : "";
    }

    // "05 Mar 2001" without Intl/toLocaleString options (old TV browsers)
    function UHDATE(v) {
        var d = new Date(v);
        if (isNaN(d.getTime())) { return String(v); }
        var day = d.getUTCDate();
        return (day < 10 ? "0" + day : day) + " " + UH_MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
