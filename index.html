    /* ====================================================================
       HPOP - unified popup (setting style)
       --------------------------------------------------------------------
       One popup shell for everything: item menus, alerts/errors, forms and
       (later) the fullscreen player setting. Structure:
           .hpop-wrap > .hpop > .hpop-head (artwork, title, close) + .hpop-body
       ES5 only. D-pad: own SpatialNavigation section "hpop" (self-only).
       Back/Escape closes it. Closing is synchronous (no animation race).
       API:
           HPOP.open({title, subtitle, art, icon, hideClose, width, className,
                      onClose, body: function (bodyEl, close, api) {}})
           HPOP.close(callback)   HPOP.isOpen()   HPOP.refresh()
           HPOP.setHeader(opts)   HPOP.body()
           HPOP.item(html, onClick)   HPOP.info(html)   HPOP.text(html)
           HPOP.buttons([{label, primary, onClick}])
       ==================================================================== */
    var HPOP = (function () {

        var SECTION = 'hpop';
        var wrap = null;
        var box = null;
        var headEl = null;
        var bodyEl = null;
        var opened = false;
        var registered = false;
        var keyBound = false;
        var blockBack = false;
        var lastFocus = null;
        var userOnClose = null;
        var api = {};

        function mk(tag, cls, html) {
            var n = document.createElement(tag);
            if (cls) { n.className = cls; }
            if (html !== undefined && html !== null) { n.innerHTML = html; }
            return n;
        }

        function hasCls(n, c) {
            return (' ' + n.className + ' ').indexOf(' ' + c + ' ') !== -1;
        }

        function addCls(n, c) {
            if (!hasCls(n, c)) { n.className += (n.className ? ' ' : '') + c; }
        }

        // Register the D-pad section once (SpatialNavigation is already initialised on load)
        function register() {
            if (registered || typeof sn === 'undefined' || !sn) { return; }
            try {
                sn.add({
                    id: SECTION,
                    selector: '.hpop .btn, .hpop .focusable',
                    restrict: 'self-only',
                    defaultElement: '.hpop .hpop-body .focusable',
                    enterTo: 'default-element'
                });
                registered = true;
            } catch (err) {
                console.log('HPOP: section register failed', err);
            }
        }

        function focusFirst() {
            if (!registered || !opened) { return; }
            try {
                sn.makeFocusable(SECTION);
                sn.focus(SECTION);
            } catch (err) {}
        }

        function restoreFocus() {
            var f = lastFocus;
            lastFocus = null;
            if (f && f.focus && document.body.contains(f)) {
                try { f.focus(); } catch (err) {}
            } else if (typeof sn !== 'undefined' && sn) {
                try { sn.focus('main'); } catch (err2) {}
            }
        }

        // Capture phase on window: runs before the global "seek" key handler
        function onKey(ev) {
            if (!opened) { return; }
            var k = ev.keyCode;
            // 27 Esc, 8 Backspace, 461 LG Back, 10009 Samsung Back
            if (k === 27 || k === 8 || k === 461 || k === 10009) {
                var tg = ev.target;
                if (k === 8 && tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) { return; }
                if (ev.preventDefault) { ev.preventDefault(); }
                if (ev.stopPropagation) { ev.stopPropagation(); }
                if (!blockBack) { close(); }
            }
        }

        function bindKeys() {
            if (keyBound) { return; }
            window.addEventListener('keydown', onKey, true);
            keyBound = true;
        }

        function unbindKeys() {
            if (!keyBound) { return; }
            window.removeEventListener('keydown', onKey, true);
            keyBound = false;
        }

        function build(opts) {
            wrap = mk('div', 'hpop-wrap');
            box = mk('div', 'hpop' + (opts.className ? ' ' + opts.className : ''));
            if (opts.width) {
                box.style.width = opts.width + 'px';
                box.style.marginLeft = '-' + Math.round(opts.width / 2) + 'px';
            }
            headEl = mk('div', 'hpop-head');
            bodyEl = mk('div', 'hpop-body');
            box.appendChild(headEl);
            box.appendChild(bodyEl);
            wrap.appendChild(box);
            // Click on the dark backdrop closes the popup (mouse / pointer remotes)
            wrap.addEventListener('click', function (ev) {
                var t = ev.target || ev.srcElement;
                if (t === wrap && !blockBack) { close(); }
            }, false);
        }

        function setHeader(opts) {
            if (!headEl) { return; }
            opts = opts || {};
            headEl.innerHTML = '';

            if (opts.art || opts.icon) {
                var art = mk('div', 'hpop-art');
                if (opts.icon) { art.appendChild(mk('div', 'hpop-art-ph', opts.icon)); }
                if (opts.art) {
                    var img = mk('img');
                    img.onerror = function () { img.style.display = 'none'; };
                    img.src = opts.art;
                    art.appendChild(img);
                }
                headEl.appendChild(art);
            }

            var tx = mk('div', 'hpop-texts');
            var t1 = mk('div', 'hpop-title', opts.title || 'Hamrahang');
            t1.setAttribute('dir', 'auto');
            tx.appendChild(t1);
            if (opts.subtitle) {
                var t2 = mk('div', 'hpop-sub', opts.subtitle);
                t2.setAttribute('dir', 'auto');
                tx.appendChild(t2);
            }
            headEl.appendChild(tx);

            if (!opts.hideClose) {
                var cl = mk('div', 'hpop-close btn', 'X');
                cl.addEventListener('click', function () { close(); }, false);
                headEl.appendChild(cl);
            }
        }

        function cleanupDom() {
            if (wrap && wrap.parentNode) { wrap.parentNode.removeChild(wrap); }
            wrap = null;
            box = null;
            headEl = null;
            bodyEl = null;
        }

        function open(opts) {
            opts = opts || {};
            blockBack = !!opts.hideClose;

            if (!opened) {
                lastFocus = document.activeElement || null;
                build(opts);
                document.body.appendChild(wrap);
                opened = true;
                register();
                bindKeys();
                // Fade-in is progressive enhancement (works without transitions too)
                setTimeout(function () { if (wrap) { addCls(wrap, 'hpop-show'); } }, 20);
            }

            // Popup reused for new content: let the previous content release its nodes first
            if (userOnClose) {
                var prevCb = userOnClose;
                userOnClose = null;
                prevCb();
            }
            userOnClose = opts.onClose || null;
            setHeader(opts);
            bodyEl.innerHTML = '';
            if (typeof opts.body === 'function') { opts.body(bodyEl, close, api); }
            focusFirst();
            return api;
        }

        function close(cb) {
            if (opened) {
                opened = false;
                unbindKeys();
                cleanupDom();
                restoreFocus();
                var done = userOnClose;
                userOnClose = null;
                if (typeof done === 'function') { done(); }
            }
            if (typeof cb === 'function') { cb(); }
        }

        // ---- content helpers ----
        function item(html, onClick, cls) {
            var n = mk('div', 'hpop-item focusable' + (cls ? ' ' + cls : ''), html);
            if (onClick) { n.addEventListener('click', function () { onClick(n); }, false); }
            return n;
        }

        function info(html) {
            return mk('div', 'hpop-item hpop-info', html);
        }

        function text(html) {
            var t = mk('div', 'hpop-text', html);
            t.setAttribute('dir', 'auto');
            return t;
        }

        function buttons(list) {
            var row = mk('div', 'hpop-actions');
            for (var i = 0; i < list.length; i++) {
                (function (def) {
                    var b = mk('div', 'hpop-btn btn' + (def.primary ? ' hpop-btn-primary' : ''), def.label);
                    b.addEventListener('click', function () { if (def.onClick) { def.onClick(b); } }, false);
                    row.appendChild(b);
                })(list[i]);
            }
            return row;
        }

        api.open = open;
        api.close = close;
        api.isOpen = function () { return opened; };
        api.refresh = focusFirst;
        api.body = function () { return bodyEl; };
        api.setHeader = function (o) { if (opened) { setHeader(o); } };
        api.item = item;
        api.info = info;
        api.text = text;
        api.buttons = buttons;
        return api;
    })();

    /* ====================================================================
       CRBW - opens the popup for an item / alert / message
       Same signature as the modern site:  CRBW(id, T, c, ctx)
           c = null    item menu (song, album, artist, playlist, video...)
           c = 'art'   artist list of the item
           c = 'alert' ctx: {title, message, okText, onOk, hideClose}
           c = 'msg'   ctx: {title, hideClose, render: function (body, close) {}}
       Legacy calls still accepted: CRBW(moreButtonElement) and CRBW(href, 'href')
       ==================================================================== */
    function CRBW_parse(href) {
        if (!href) { return null; }
        var path = String(href).replace(/^[a-z]+:\/\/[^\/]+/i, '').split('?')[0].split('#')[0];
        var seg = path.split('/');
        var T = seg[1];
        var id = seg[2];
        if (!T || !id) { return null; }
        if (['song', 'podcast', 'album', 'artist', 'playlist', 'video', 'musicvideo'].indexOf(T) === -1) { return null; }
        return { T: T, id: id };
    }

    function CRBW_artists(e) {
        var out = [];
        var refs = (e && Array.isArray(e.artists)) ? e.artists : [];
        for (var i = 0; i < refs.length; i++) {
            var ref = refs[i];
            var aid = (typeof ref === 'object' && ref !== null) ? ref.id : ref;
            if (SN.artist && SN.artist[aid]) { out.push(SN.artist[aid]); }
        }
        return out;
    }

    function CRBW_names(list) {
        var n = [];
        for (var i = 0; i < list.length; i++) { n.push(list[i].name); }
        return n.join(' - ');
    }

    function CRBW_base(T) {
        if (T === 'album') { return HL; }
        if (T === 'artist') { return HA; }
        if (T === 'playlist') { return HPL; }
        if (T === 'video' || T === 'musicvideo') { return HV; }
        return HS;
    }

    function CRBW_shareBase(T) {
        if (T === 'album') { return HP + 'album/'; }
        if (T === 'artist') { return HP + 'artist/'; }
        if (T === 'playlist') { return HPLU; }
        if (T === 'video' || T === 'musicvideo') { return HP + 'video/'; }
        return HSU;
    }

    function CRBW(id, T, c, ctx) {
        ctx = ctx || {};
        c = c || null;

        // Legacy call 1: CRBW(element) - the ".more" button of a list row
        if (id && typeof id === 'object' && id.nodeType === 1) {
            var row = id.parentElement || id.parentNode;
            var lnk = row ? row.querySelector('a') : null;
            var p1 = CRBW_parse(lnk ? lnk.href : '');
            if (p1) { CRBW(p1.id, p1.T, null, ctx); }
            return;
        }

        // Legacy call 2: CRBW(href, 'href')
        if (T === 'href' && typeof id === 'string') {
            var p2 = CRBW_parse(id);
            if (p2) { CRBW(p2.id, p2.T, null, ctx); }
            return;
        }

        // ---- alert / error ----
        if (c === 'alert') {
            HPOP.open({
                title: ctx.title || 'توجه',
                hideClose: !!ctx.hideClose,
                body: function (body, close) {
                    body.appendChild(HPOP.text(ctx.message || ''));
                    body.appendChild(HPOP.buttons([{
                        label: ctx.okText || 'متوجه شدم',
                        primary: true,
                        onClick: function () {
                            close(function () { if (typeof ctx.onOk === 'function') { ctx.onOk(); } });
                        }
                    }]));
                }
            });
            return;
        }

        // ---- free content: caller renders into the body ----
        if (c === 'msg') {
            HPOP.open({
                title: ctx.title || 'پیام',
                hideClose: !!ctx.hideClose,
                body: function (body, close) {
                    if (typeof ctx.render !== 'function') {
                        body.appendChild(HPOP.text('محتوایی تعریف نشده'));
                        return;
                    }
                    ctx.render(body, close);
                }
            });
            return;
        }

        // ---- playlist editing modes are not available on TV yet ----
        if (c === 'add' || c === 'pls' || c === 'rmpls' || c === 'edit' || c === 'del') {
            CRBW(null, null, 'alert', { title: 'توجه', message: 'این بخش هنوز در نسخهٔ تلویزیون فعال نیست.' });
            return;
        }

        if (id === null || id === undefined || !T) { return; }

        // Data not loaded yet: fetch once, then retry
        if (!SN[T] || !SN[T][id]) {
            if (ctx._retried) {
                CRBW(null, null, 'alert', { title: 'خطا', message: 'اطلاعات پیدا نشد. دوباره تلاش کنید.' });
                return;
            }
            var ctx2 = {};
            for (var k in ctx) { if (ctx.hasOwnProperty(k)) { ctx2[k] = ctx[k]; } }
            ctx2._retried = true;
            gjs([T, id], function () { CRBW(id, T, c, ctx2); });
            return;
        }

        CRBW_open(SN[T][id], id, T, c, ctx);
    }

    function CRBW_open(e, id, T, c, ctx) {
        var artists = CRBW_artists(e);

        HPOP.open({
            title: e.name || '',
            body: function (body, close) {
                if (c === 'art') {
                    CRBW_artistRows(body, close, artists);
                } else {
                    CRBW_menu(body, close, e, id, T, ctx, artists);
                }
            }
        });
    }

    function CRBW_artistRows(body, close, artists) {
        if (!artists.length) {
            body.appendChild(HPOP.text('هنرمندی نیست'));
            return;
        }
        for (var i = 0; i < artists.length; i++) {
            (function (a) {
                body.appendChild(HPOP.item(svg_g2a + a.name, function () {
                    close(function () { chp(HA + a.id + '/' + (a.url || '')); });
                }));
            })(artists[i]);
        }
    }

    function CRBW_menu(body, close, e, id, T, ctx, artists) {
        var primaryArtistUrl = artists.length ? (artists[0].url || '') : '';
        var slug = (primaryArtistUrl && T !== 'artist' ? primaryArtistUrl + '-' : '') + (e.url || '');
        var cover = (e.meta && e.meta.tmb) ? UT + e.meta.tmb + '.jpg' : '';

        // Icon box: square button (icon on top, label below); wide = stretched bar.
        // Receives the label node so handlers can update the text in place.
        function hbox(iconSvg, label, onClick, wide) {
            var b = OA(document.createElement('div'), { className: 'hpop-box focusable' + (wide ? ' hpop-box-wide' : '') });
            var ico = OA(document.createElement('div'), { className: 'hpop-box-ico', innerHTML: iconSvg });
            var lb = OA(document.createElement('div'), { className: 'hpop-box-lb', innerHTML: label });
            b.appendChild(ico);
            b.appendChild(lb);
            if (onClick) { b.addEventListener('click', function () { onClick(lb, ico, b); }, false); }
            return b;
        }

        var split = OA(document.createElement('div'), { className: 'hpop-split' });

        // -- Left: cover, name, artist, plays
        var left = OA(document.createElement('div'), { className: 'hpop-left' });
        var cov = OA(document.createElement('div'), { className: 'hpop-cover' });
        if (cover) {
            var img = OA(document.createElement('img'));
            img.onerror = function () { img.style.display = 'none'; };
            img.src = cover;
            cov.appendChild(img);
        }
        left.appendChild(cov);

        var nm = OA(document.createElement('div'), { className: 'hpop-side-name', innerHTML: e.name || '' });
        nm.setAttribute('dir', 'auto');
        left.appendChild(nm);

        if (artists.length) {
            var lart = OA(document.createElement('div'), { className: 'hpop-side-artist', innerHTML: CRBW_names(artists) });
            lart.setAttribute('dir', 'auto');
            left.appendChild(lart);
        }

        left.appendChild(OA(document.createElement('div'), {
            className: 'hpop-side-plays',
            innerHTML: ((e.meta && e.meta.ncp !== undefined && e.meta.ncp !== null) ? e.meta.ncp + ' Plays' : 'Plays')
        }));
        split.appendChild(left);

        // -- Right: action boxes
        var right = OA(document.createElement('div'), { className: 'hpop-right' });
        var row = OA(document.createElement('div'), { className: 'hpop-box-row' });

        // Like / Follow — مثل ha.php: قابل پلی → قلب (لایک)، بقیه → بوکمارک (فاو)
        if (typeof IsFavorite === 'function' && typeof ToggleFavorite === 'function') {
            var playable = IsPlayableType(T);
            var on = playable ? ['Unlike', 'Like'] : ((T === 'artist') ? ['Following', 'Follow'] : ['Favorited', 'Favorite']);
            var ic = playable ? [svg_lik, svg_lik2] : [svg_fav, svg_fav2];
            var favOn = IsFavorite(T, id);
            row.appendChild(hbox(favOn ? ic[1] : ic[0], favOn ? on[0] : on[1], function (lb, ico) {
                var now = ToggleFavorite(T, id);
                ico.innerHTML = now ? ic[1] : ic[0];
                lb.innerHTML = now ? on[0] : on[1];
            }));
        }

        // Queue / Playlist (placeholders until TV gets a real queue)
        if (T !== 'artist') {
            row.appendChild(hbox(svg_a2p, 'to Queue', function () {
                CTMS('Queue is not available on TV yet');
            }));
            row.appendChild(hbox(svg_a2p, 'to Playlist', function () {
                CTMS('Playlists are not available on TV yet');
            }));
        }

        // Report (placeholder page inside the same popup)
        row.appendChild(hbox(svg_inf, 'Report', function () {
            body.innerHTML = '';
            body.appendChild(HPOP.text('گزارش از طریق تلویزیون هنوز فعال نیست.'));
            body.appendChild(HPOP.buttons([{
                label: 'Back',
                primary: true,
                onClick: function () { CRBW(id, T, null, ctx); }
            }]));
            HPOP.refresh();
        }));
        right.appendChild(row);

        // Go to item
        right.appendChild(hbox(svg_g2s, 'Go to ' + T, function () {
            close(function () { chp(CRBW_base(T) + id + '/' + slug); });
        }, true));

        // Go to artist (one artist: open directly, several: show the list in the same popup)
        if (artists.length && T !== 'artist') {
            right.appendChild(hbox(svg_g2a, 'Go to artist', function () {
                if (artists.length === 1) {
                    close(function () { chp(HA + artists[0].id + '/' + (artists[0].url || '')); });
                } else {
                    CRBW(id, T, 'art', {});
                }
            }, true));
        }

        split.appendChild(right);
        body.appendChild(split);
    }

    function PlayVideo(id, list, T) {
    
        T = T || 'video';
        var videoTypes = ['video', 'musicvideo'];
    
        if (videoTypes.indexOf(T) === -1) {
            console.log("PlayVideo: Invalid type:", T);
            return;
        }
    
        if (SN.NowPlaying && SN.NowPlaying.id === id && SN.NowPlaying.player === 'video') {
            SN.NowPlaying.list = (list && Array.isArray(list)) ? list : SN.NowPlaying.list;
            ToggleMainPlayPause();
            OpenMainPlayer();
            return;
        }
    
        var playlist = (list && Array.isArray(list)) ? list : VdoLst;
        VdoLst = playlist;
    
        UVID(['video', id], function (success, e) {

            if (!success || !e) {
                console.log("PlayVideo: Could not load video:", id);
                return;
            }
        
            // نوع واقعی رو از داده‌ی برگشتی بگیر، نه از پارامتر T که از بیرون حدسی پاس داده شده
            var actualType = (e.meta && e.meta.type === 'musicvideo') ? 'musicvideo' : 'video';
        
            var idx = playlist ? playlist.indexOf(id) : -1;
            var isSamePlaylist = !!(SN.NowPlaying && SN.NowPlaying.list === playlist);
        
            var playedInShuffle;
            if (isSamePlaylist && SN.NowPlaying.playedInShuffle) {
                playedInShuffle = SN.NowPlaying.playedInShuffle.slice();
                if (playedInShuffle.indexOf(id) === -1) {
                    playedInShuffle.push(id);
                }
            } else {
                playedInShuffle = [id];
            }
        
            SN.NowPlaying = {
                id: id,
                type: actualType,   // ← اصلاح شد
                player: 'video',
                item: e,
                list: playlist,
                index: idx,
                isPlaying: true,
                isBuffering: true,
                playedInShuffle: playedInShuffle
            };
        
            console.log("PlayVideo: Now Playing:", SN.NowPlaying);
        
            var artistUrls = [];
            var artistRefs = (e.artists && Array.isArray(e.artists)) ? e.artists : [];
        
            for (var j = 0; j < artistRefs.length; j++) {
                var artistRef = artistRefs[j];
                var artistId = (typeof artistRef == "object") ? artistRef.id : artistRef;
        
                if (SN.artist && SN.artist[artistId] && SN.artist[artistId].url) {
                    artistUrls.push(SN.artist[artistId].url);
                }
            }
        
            var ArtistUrl = artistUrls.join("-");
        
            UpdateMiniPlayer(e, ArtistUrl);
            UpdateVideoPlayerUI(e, ArtistUrl);
        
            if (!SN.PlayHistory) { SN.PlayHistory = []; }
            SN.PlayHistory.push({ id: id, player: 'video' });
            if (SN.PlayHistory.length > 50) { SN.PlayHistory.shift(); }
        
            PlayVideoSourceAt(0);
            OpenMainPlayer();
        });
    }

    function PlayVideoSourceAt(index) {
    
        if (!SN.NowPlaying || SN.NowPlaying.player !== 'video') { return; }
    
        var sources = (SN.NowPlaying.item && Array.isArray(SN.NowPlaying.item.sources)) ? SN.NowPlaying.item.sources : [];
    
        if (sources.length === 0 || index >= sources.length) {
            console.log("PlayVideo: All sources failed for video:", SN.NowPlaying.id);
            HandleAllVideoSourcesFailed();
            return;
        }
    
        SN.NowPlaying.sourceIndex = index;
        SN.NowPlaying._sourceFailed = false;
    
        Video.src = sources[index].url;
    
        var playPromise = Video.play();
        if (playPromise !== undefined) {
            playPromise.catch(function (err) {
                console.log("PlayVideoSourceAt: play() rejected for source " + index + ":", err.name);
                handleVideoSourceFailure(index);
            });
        }
    }
    
    function handleVideoSourceFailure(failedIndex) {
        if (!SN.NowPlaying) { return; }
        if (SN.NowPlaying.sourceIndex !== failedIndex || SN.NowPlaying._sourceFailed) { return; }
        SN.NowPlaying._sourceFailed = true;
        PlayVideoSourceAt(failedIndex + 1);
    }
    
    function HandleAllVideoSourcesFailed() {
        if (!SN.NowPlaying) { return; }
        console.log("PlayVideo: Could not play video, skipping:", SN.NowPlaying.item.name);
        // منطق مشابه HandleAllSourcesFailed صوتی — می‌تونیم بعداً یکی‌سازی کنیم

    function PlayItem(id, list, T) {
        
        
        T = T || 'song';

        var audioTypes = ['song', 'album', 'podcast'];
    
        if (audioTypes.indexOf(T) === -1) {
            console.log("PlayItem: Video player not implemented yet for type:", T);
            return;
        }
    
        if (SN.NowPlaying && SN.NowPlaying.id === id) {
            SN.NowPlaying.list = AduLst;
            TogglePlayPause();
            return;
        }
    
        var playlist = (list && Array.isArray(list)) ? list : AduLst;
        PlyLst = playlist;
    
        USNG(['song', id], function (success, song) {
    
            if (!success || !song) {
                console.log("PlayItem: Could not load song:", id);
                return;
            }
        
            var idx = playlist ? playlist.indexOf(id) : -1;
    
            // آیا داریم همون پلی‌لیست قبلی رو ادامه می‌دیم یا یه پلی‌لیست/context جدیده؟
            var isSamePlaylist = !!(SN.NowPlaying && SN.NowPlaying.list === playlist);
            
            var playedInShuffle;
            if (isSamePlaylist && SN.NowPlaying.playedInShuffle) {
                playedInShuffle = SN.NowPlaying.playedInShuffle.slice();
                if (playedInShuffle.indexOf(id) === -1) {
                    playedInShuffle.push(id);
                }
            } else {
                playedInShuffle = [id];
            }
    
            SN.NowPlaying = {
                id: id,
                type: T,
                player: 'audio',
                item: song,
                list: playlist,
                index: idx,
                isPlaying: true,
                isBuffering: true,
                playedInShuffle: playedInShuffle
            };
            
            //Audio.src = pickBestSource(song.sources).url;

            console.log("PlayItem: Now Playing:", SN.NowPlaying);
            
            var artistUrls = [];
            var ArtistUrl = "";
            var artistRefs = (song.artists && Array.isArray(song.artists)) ? song.artists : [];
        
            for (var j = 0; j < artistRefs.length; j++) {
                var artistRef = artistRefs[j];
                var artistId = (typeof artistRef == "object") ? artistRef.id : artistRef;
        
                if (SN.artist && SN.artist[artistId] && SN.artist[artistId].url) {
                    artistUrls.push(SN.artist[artistId].url);
                }
            }
            
            ArtistUrl = artistUrls.join("-");

            UpdateMiniPlayer(song, ArtistUrl);
        
            CRMP(ArtistUrl);
            UpdatePlayButtons();
            UpdatePlaylistRowIcons();
            PlaySourceAt(0);
            
            if (!SN.PlayHistory) {
                SN.PlayHistory = [];
            }
            SN.PlayHistory.push(id);
        
            if (SN.PlayHistory.length > 50) {
                SN.PlayHistory.shift();
            }

            // تاریخچهٔ دائم مثل ha.php: لوکال (ha_profile) + sync سرور
            PushPlayHistory(id, (T === 'podcast') ? 'podcast' : 'song');
        });
    }

    function pickBestSource(sources, preferredQuality) {

    preferredQuality = preferredQuality || 'high';

    var sorted = sources.slice().sort(function (a, b) {
        return parseInt(b.bit, 10) - parseInt(a.bit, 10);
    });

    if (preferredQuality === 'high') {
        return sorted[0];
    }

    if (preferredQuality === 'low') {
        return sorted[sorted.length - 1];
    }

    // medium: نزدیک‌ترین به وسط لیست
    return sorted[Math.floor(sorted.length / 2)];
}
    
    function PlaySourceAt(index) {

        if (!SN.NowPlaying) { return; }
    
        var sources = (SN.NowPlaying.item && Array.isArray(SN.NowPlaying.item.sources)) ? SN.NowPlaying.item.sources : [];
    
        if (sources.length === 0 || index >= sources.length) {
    
            console.log("PlayItem: All sources failed for song:", SN.NowPlaying.id);
    
            HandleAllSourcesFailed();
            return;
        }
    
        SN.NowPlaying.sourceIndex = index;
        SN.NowPlaying._sourceFailed = false;
    
        console.log("PlayItem: Trying source " + index + ":", sources[index].url);
    
        Audio.src = sources[index].url;
    
        var playPromise = Audio.play();
    
        if (playPromise !== undefined) {
            playPromise.catch(function (err) {
                console.log("PlaySourceAt: play() rejected for source " + index + ":", err.name);
                handleSourceFailure(index);
            });
        }
    }
    
    function handleSourceFailure(failedIndex) {
    
        if (!SN.NowPlaying) { return; }
    
        if (SN.NowPlaying.sourceIndex !== failedIndex || SN.NowPlaying._sourceFailed) {
            return;
        }
    
        SN.NowPlaying._sourceFailed = true;
    
        console.log("PlayItem: Source " + failedIndex + " failed, trying next...");
        PlaySourceAt(failedIndex + 1);
    }
    
    function HandleAllSourcesFailed() {
    
        if (!SN.NowPlaying) { return; }
    
        var failedId = SN.NowPlaying.id;
        var failedName = SN.NowPlaying.item ? SN.NowPlaying.item.name : failedId;
    
        console.log("PlayItem: Could not play song, skipping:", failedName);
        ShowPlaybackError(failedName);
    
        SN.NowPlaying.isPlaying = false;
        SN.NowPlaying.isBuffering = false;
        UpdatePlayButtons();
        UpdatePlaylistRowIcons();
    
        SN.SkipAttempts = (SN.SkipAttempts || 0) + 1;
    
        var maxAttempts = (SN.NowPlaying.list && SN.NowPlaying.list.length) || 1;
    
        if (SN.SkipAttempts >= maxAttempts) {
            console.log("PlayItem: Too many consecutive failures, stopping auto-skip");
            SN.SkipAttempts = 0;
            return;
        }
    
        var nextId = GetNextSongId();
    
        if (nextId === null || nextId === failedId) {
            SN.SkipAttempts = 0;
            return;
        }
    
        PlayItem(nextId, SN.NowPlaying.list, 'song');
    }

    function FormatTime(seconds) {
        if (!seconds || isNaN(seconds) || seconds < 0) { return "0:00"; }
        var m = Math.floor(seconds / 60);
        var s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? "0" + s : s);
    }
    
    function UpdateProgressBar() {
        var current = Audio.currentTime || 0;
        var duration = Audio.duration || 0;
        var percent = duration > 0 ? (current / duration) * 100 : 0;
    
        var currentEls = document.querySelectorAll(".time .current");
        var finalEls = document.querySelectorAll(".time .final");
        var barEls = document.querySelectorAll(".progress-bar");
    
        var i;
        for (i = 0; i < currentEls.length; i++) { currentEls[i].innerHTML = FormatTime(current); }
        for (i = 0; i < finalEls.length; i++) { finalEls[i].innerHTML = FormatTime(duration); }
        for (i = 0; i < barEls.length; i++) { barEls[i].style.width = percent + "%"; }
    }
    
    function findAncestorWithClass(el, className) {
        while (el && el !== document) {
            if (el.classList && el.classList.contains(className)) {
                return el;
            }
            el = el.parentNode;
        }
        return null;
    }
    
    function InitSeekBar() {

        document.addEventListener("click", function (ev) {
    
            if (!ev.isTrusted) { return; }
    
            var bar = findAncestorWithClass(ev.target, "progress-details");
            if (!bar) { return; }
    
            if (bar.id === "main-progress") {
    
                if (!SN.NowPlaying) { return; }
                
                var media = GetActiveMediaElement();
                var rect = bar.getBoundingClientRect();
                var percent = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
    
                media.currentTime = percent * media.duration;
                UpdateMainProgressBar();
                return;
            }
 
            if (!SN.NowPlaying || !Audio.duration || isNaN(Audio.duration)) { return; }
    
            var rectA = bar.getBoundingClientRect();
            var percentA = Math.max(0, Math.min(1, (ev.clientX - rectA.left) / rectA.width));
    
            Audio.currentTime = percentA * Audio.duration;
            UpdateProgressBar();
        });
    }

    function GetNextSongId() {

        if (!SN.NowPlaying || !SN.NowPlaying.list || !Array.isArray(SN.NowPlaying.list)) {
            return null;
        }
    
        var list = SN.NowPlaying.list;
    
        if (!SN.ShuffleMode) {
    
            // حالت عادی: همون ترتیب لیست
            var nextIndex = SN.NowPlaying.index + 1;
    
            if (nextIndex >= list.length) {
                if (SN.RepeatMode === 'all') {
                    nextIndex = 0;
                } else {
                    return null;
                }
            }
    
            SN.NowPlaying.index = nextIndex;
            return list[nextIndex];
        }
    
        // حالت شافل: یه id تصادفی از بین چیزهایی که هنوز در این چرخه پخش نشدن
        if (!SN.NowPlaying.playedInShuffle) {
            SN.NowPlaying.playedInShuffle = [SN.NowPlaying.id];
        }
    
        var remaining = list.filter(function (songId) {
            return SN.NowPlaying.playedInShuffle.indexOf(songId) === -1;
        });
    
        if (remaining.length === 0) {
    
            if (SN.RepeatMode === 'all') {
                // چرخه‌ی جدید شافل شروع می‌شه
                SN.NowPlaying.playedInShuffle = [];
                remaining = list.slice();
            } else {
                return null;
            }
        }
    
        var randomIndex = Math.floor(Math.random() * remaining.length);
        var nextId = remaining[randomIndex];
    
        SN.NowPlaying.playedInShuffle.push(nextId);
        SN.NowPlaying.index = list.indexOf(nextId);   // برای سازگاری با کدهایی که به index نیاز دارن
    
        return nextId;
    }
    
    function PlayNext() {

        if (!SN.NowPlaying) { return; }
    
        if (SN.RepeatMode === 'one') {
            Audio.currentTime = 0;
            var playPromise = Audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(function (err) {
                    console.log("PlayNext (repeat one): play() rejected:", err.name);
                });
            }
            return;
        }
    
        var nextId = GetNextSongId();
    
        if (nextId === null) {
            console.log("PlayNext: End of playlist reached");
            return;
        }
    
        PlayItem(nextId, SN.NowPlaying.list, 'song');
    }
    
    function PlayPrevious() {
    
        if (!SN.NowPlaying) { return; }
    
        // اگه بیشتر از ۳ ثانیه از آهنگ گذشته، Previous یعنی "برگرد به اول همین آهنگ" (رفتار استاندارد پلیرها)
        if (Audio.currentTime > 3) {
            Audio.currentTime = 0;
            return;
        }
    
        if (!SN.PlayHistory || SN.PlayHistory.length < 2) {
            // تاریخچه‌ای برای برگشت وجود نداره؛ فقط همین آهنگ رو از اول پخش کن
            Audio.currentTime = 0;
            return;
        }
    
        // آخرین آیتم خودِ آهنگ فعلیه؛ باید یکی قبلش رو برداریم
        SN.PlayHistory.pop();   // حذف آهنگ فعلی از تاریخچه
        var prevId = SN.PlayHistory.pop();   // آهنگ قبلی
    
        PlayItem(prevId, SN.NowPlaying.list, 'song');
    }

    function handleShowSettingModal(q){
        if (HPOP.isOpen()) { HPOP.close(); return; }
        var src = document.getElementById("modal-content");
        if (!src) { return; }
        var prev = document.activeElement || null;
        var cols = null;
        HPOP.open({
            title: 'Setting',
            className: 'hpop-setting',
            body: function (body) {
                cols = document.createElement('div');
                cols.className = 'hpop-cols';
                while (src.firstChild) { cols.appendChild(src.firstChild); }
                body.appendChild(cols);
            },
            onClose: function () {
                while (cols && cols.firstChild) { src.appendChild(cols.firstChild); }
                cols = null;
                // The player controls may have auto-hidden meanwhile: show them, then restore focus
                if (typeof showPlayerBox === 'function') { showPlayerBox(); }
                if (prev && prev.focus) { try { prev.focus(); } catch (err) {} }
            }
        });
    }

    var nativeEvents = [
      [
        "requestFullscreen",

        "fullscreenEnabled",
        "fullscreenchange",
        "fullscreenerror",
      ],
      [

      ],

        "MSFullscreenError",
      ],
    ];
    var events = {};

      if (item[1] in document) {
        for (var i = 0; i < nativeEvents[0].length; i++) {
          events[nativeEvents[0][i]] = item[i];
        }

    };  
     
    var seek = function (e) {
        
        if (e.keyCode === 13 ) {
            document.activeElement.click();
            return;
        }
        
        if (e.keyCode === 8 || e.keyCode === 461 ) {
            back2home();
            return;
        }
        
        if (document.activeElement !== progressBar) {
          return;
        }

        if (e.keyCode === 38 || e.keyCode === 40) {
          e.preventDefault();
          return;
        }
        
        if (e.keyCode === 37 || e.keyCode === 39) {
          e.preventDefault();
          var time = 0; 
          if (e.keyCode === 37) {
            time = -15;
          }
          if (e.keyCode === 39) {
            time = 15;
          }
          VPLY.currentTime += time;
        }
    };
        
    document.addEventListener("keydown", seek); 
    document.addEventListener("keypress", ()=>{ document.activeElement.click(); return; });

    function formatTime(seconds) {
        var hrs = Math.floor(seconds / 3600);
        var mins = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;
    
        if (hrs > 0) {
          hrs = hrs < 10 ? "0" + Math.round(hrs) : Math.round(hrs);
        } else {
          hrs = null;
        }
        mins = mins < 10 ? "0" + Math.round(mins) : Math.round(mins);
        secs = secs < 10 ? "0" + Math.round(secs) : Math.round(secs);
    
        if (hrs) {
          return hrs + ":" + mins + ":" + secs;
        } else {
          return mins + ":" + secs;
        }
    }
